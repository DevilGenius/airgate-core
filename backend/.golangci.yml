version: "2"

linters:
  exclusions:
    generated: strict
    paths:
      # Scratch Go programs under backend/tmp are gitignored, but golangci-lint
      # does not honor .gitignore, so they would otherwise fail lint on a clean
      # checkout that happens to contain them. Paths here are relative to this
      # config file's directory (backend/), not the repository root.
      - ^tmp/
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell

formatters:
  exclusions:
    generated: strict
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DevilGenius

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
