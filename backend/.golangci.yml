version: "2"

linters:
  exclusions:
    generated: strict
    paths:
      # Filter reported lint issues in backend/tmp (relative to this config).
      # This does not skip package loading or suppress typecheck errors.
      # Put scratch Go programs in the repository-root .tools/ instead.
      - ^tmp/
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell

formatters:
  exclusions:
    generated: strict
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DevilGenius

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
